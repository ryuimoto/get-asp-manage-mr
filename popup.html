<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Rentracks 案件一覧</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      margin: 0;
      padding: 14px 16px;
      width: 240px;
    }
    h1 {
      font-size: 13px;
      font-weight: 600;
      margin: 0 0 12px;
      color: #333;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
    }
    .row label {
      cursor: pointer;
      user-select: none;
    }
    .hint {
      color: #888;
      font-size: 11px;
      margin: -8px 0 12px 22px;
    }
    button {
      width: 100%;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      background: #2980b9;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #2471a3; }
    button:active { background: #1f618d; }
    .footer {
      margin-top: 12px;
      text-align: right;
    }
    .footer a {
      color: #2980b9;
      font-size: 11px;
      text-decoration: none;
      cursor: pointer;
    }
    .footer a:hover { text-decoration: underline; }
    .progress-status {
      font-size: 12px;
      color: #333;
      margin-bottom: 8px;
      text-align: center;
      min-height: 18px;
    }
    .progress-status.error { color: #c0392b; }
    .progress-status.done { color: #27ae60; font-weight: 600; }
    progress {
      width: 100%;
      height: 10px;
      margin-bottom: 6px;
    }
    .progress-detail {
      font-size: 11px;
      color: #888;
      text-align: center;
      min-height: 14px;
      margin-bottom: 12px;
    }
    button.secondary {
      color: #2980b9;
      background: #fff;
      border: 1px solid #2980b9;
      font-weight: 500;
    }
    button.secondary:hover { background: #f0f7fb; }
    button.secondary:active { background: #e1eef7; }
  </style>
</head>
<body>
  <h1>Rentracks 案件一覧</h1>

  <div id="formSection">
    <div class="row">
      <input type="checkbox" id="debugMode">
      <label for="debugMode">デバッグモード(1件のみCSV)</label>
    </div>
    <div class="hint">ON のとき1ページ目の先頭1件だけ出力</div>
    <button id="run">CSV取得</button>
    <div class="footer">
      <a id="openOptions">設定</a>
    </div>
  </div>

  <div id="progressSection" hidden>
    <div class="progress-status" id="progressStatus">開始中…</div>
    <progress id="progressBar" max="100"></progress>
    <div class="progress-detail" id="progressDetail"></div>
    <button id="progressClose" class="secondary">閉じる</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
